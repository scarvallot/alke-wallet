<!doctype html>
<html lang="en">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <meta charset="UTF-8" />
  <title>Login - Mi Wallet</title>
  <!-- Bootstrap 4.5 CSS para estilos base responsivos -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css"
    integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous" />
  <!-- Font Awesome -->
  <script src="https://kit.fontawesome.com/ebe45e2f8b.js" crossorigin="anonymous"></script>
  <!-- Google Fonts: Inter como tipografía principal para mejor legibilidad -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap"
    rel="stylesheet" />
  <!-- Estilos personalizados (sobrescribe o complementa Bootstrap) -->
  <link rel="stylesheet" href="login.css" />
</head>

<body>
  <!-- Contenedor flex que centra el contenido vertical y horizontalmente en toda la pantalla -->
  <div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="row w-100 justify-content-center">
      <!-- Columnas responsivas: en móvil ocupa todo el ancho (col-12) -->
      <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
        <!-- Tarjeta principal de login -->
        <div class="card login-card p-4 p-sm-5">
          <div class="card-body text-center">
            <!-- Icono representativo de wallet/billetera -->
            <i class="fas fa-wallet fa-3x text-primary mb-3"></i>
            <h1 class="h3 mb-1 login-header">Mi Wallet</h1>
            <p class="login-tagline mb-4">Tu billetera digital segura</p>

            <!-- Formulario de login -->
            <form id="loginForm">
              <!-- Campo de usuario con icono y validación -->
              <div class="form-group text-left">
                <label for="username" class="font-weight-bold">Usuario</label>
                <div class="input-group">
                  <div class="input-group-prepend">
                    <span class="input-group-text"><i class="fa-solid fa-circle-user"></i></span>
                  </div>
                  <input type="text" id="username" class="form-control form-control-lg"
                    placeholder="Ingresa tu usuario" />
                </div>
              </div>
              <!-- Campo de contraseña con icono y validación -->
              <div class="form-group text-left">
                <label for="password" class="font-weight-bold">Contraseña</label>
                <div class="input-group">
                  <div class="input-group-prepend">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                  </div>
                  <input type="password" id="password" class="form-control form-control-lg"
                    placeholder="Ingresa tu contraseña" />
                </div>
              </div>
              <!-- Botón de envío con estilo success y efecto hover -->
              <button type="submit" class="btn btn-login btn-success btn-login mt-4" id="loginBtn">
                <i class="fa-solid fa-arrow-right-to-bracket mr-2"></i><span>Iniciar Sesión</span>
              </button>
            </form>

            <!-- Contenedor para mostrar alertas dinámicas -->
            <div id="alertContainer" class="mt-3 w-100"></div>

            <!-- Credenciales de acceso de prueba -->
            <div class="mt-4 pt-3 border-top text-left small text-muted">
              <p class="mb-1 font-weight-bold text-dark">
                Credenciales de prueba
              </p>
              <p class="mb-1">Usuario: <strong>admin</strong></p>
              <p class="mb-0">Contraseña: <strong>12345</strong></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts: jQuery, Popper.js, Bootstrap JS -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"
    integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.min.js"
    integrity="sha384-w1Q4orYjBQndcko6MimVbzY0tgp4pWB4lZ7lr30WKz0vr/aWKhXdBNmNb5D92v7s"
    crossorigin="anonymous"></script>
  <!-- Lógica propia de la aplicación -->
  <script src="login.js"></script>
</body>

</html>
