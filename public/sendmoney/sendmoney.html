<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=yes"
    />
    <title>Mi Wallet - Enviar Dinero</title>
    <!-- Bootstrap 4.5 CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css"
      integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2"
      crossorigin="anonymous"
    />
    <!-- Font Awesome -->
    <script
      src="https://kit.fontawesome.com/ebe45e2f8b.js"
      crossorigin="anonymous"
    ></script>
    <!-- CSS personalizado -->
    <link rel="stylesheet" href="sendmoney.css" />
  </head>

  <body class="bg-light">
    <!-- Header -->
    <div class="bg-primary text-white pt-4 pb-3">
      <div class="container">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <h1 class="h3 mb-2">Mi Wallet</h1>
            <p class="small text-white-50 mb-0">Bienvenido, Usuario</p>
          </div>
          <div>
            <i class="fas fa-user-circle fa-2x text-white-50"></i>
          </div>
        </div>
      </div>
    </div>

    <!-- Contenido principal -->
    <div class="container mt-4">
      <!-- Tarjeta de saldo -->
      <div class="card border-0 shadow-sm mb-4">
        <div class="card-body text-center py-4">
          <h5 class="card-title text-muted font-weight-normal">
            Saldo Disponible
          </h5>
          <h1 class="display-4 font-weight-bold" id="balance">$0</h1>
          <small class="text-muted">Actualizado en tiempo real</small>
        </div>
      </div>

      <!-- Alertas dinámicas -->
      <div id="alertContainer"></div>

      <!-- Formulario de búsqueda -->
      <form id="searchForm" class="mb-3">
        <div class="input-group">
          <input
            type="text"
            class="form-control"
            id="searchContact"
            placeholder="Buscar contacto por nombre o alias"
          />
          <div class="input-group-append">
            <button type="submit" class="btn btn-outline-primary">
              <i class="fas fa-search"></i> Buscar
            </button>
          </div>
        </div>
      </form>

      <!-- Botón agregar contacto -->
      <button
        type="button"
        class="btn btn-success btn-block mb-3"
        id="btnAgregarContacto"
      >
        <i class="fas fa-user-plus mr-2"></i>Agregar nuevo contacto
      </button>

      <!-- Formulario agregar contacto (oculto por defecto) -->
      <div
        id="addContactFormContainer"
        class="card border-0 shadow-sm mb-3"
        style="display: none"
      >
        <div class="card-body">
          <h6 class="font-weight-bold mb-3">
            <i class="fas fa-user-plus mr-2"></i>Nuevo contacto
          </h6>
          <form id="addContactForm">
            <div class="form-group">
              <label for="contactName">Nombre y apellido</label>
              <input
                type="text"
                class="form-control"
                id="contactName"
                placeholder="Ej: Juan Pérez"
              />
              <small class="text-danger" id="errNombre"></small>
            </div>
            <div class="form-group">
              <label for="contactCbu">CBU (mínimo 10 dígitos)</label>
              <input
                type="text"
                class="form-control"
                id="contactCbu"
                placeholder="Ej: 0123456789012345678"
              />
              <small class="text-danger" id="errCbu"></small>
            </div>
            <div class="form-group">
              <label for="contactAlias">Alias</label>
              <input
                type="text"
                class="form-control"
                id="contactAlias"
                placeholder="Ej: juan.perez"
              />
              <small class="text-danger" id="errAlias"></small>
            </div>
            <div class="d-flex">
              <button type="submit" class="btn btn-primary mr-2">
                Guardar contacto
              </button>
              <button
                type="button"
                class="btn btn-secondary"
                id="btnCancelarContacto"
              >
                Cancelar
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- Lista de contactos -->
      <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">
          <h6 class="font-weight-bold mb-3">
            <i class="fas fa-address-book mr-2"></i>Mis Contactos
          </h6>
          <div id="contactList"></div>
        </div>
      </div>

      <!-- Tarjeta con botones de navegación -->
      <div class="card border-0 shadow-sm mb-3 mt-4">
        <div class="card-body p-2">
          <div class="row no-gutters">
            <!-- Botón Depositar -->
            <div class="col-4 pr-1">
              <button
                class="btn btn-light w-100 d-flex flex-column align-items-center py-3"
                id="depositBtn"
              >
                <span class="icon-circle icon-deposit mb-2">
                  <i class="fa-solid fa-money-bill-1-wave"></i>
                </span>
                <span class="small font-weight-bold text-center"
                  >Depositar</span
                >
              </button>
            </div>

            <!-- Botón Últimos Movimientos -->
            <div class="col-4 px-1">
              <button
                class="btn btn-light w-100 d-flex flex-column align-items-center py-3"
                id="transactionBtn"
              >
                <span class="icon-circle icon-movements mb-2">
                  <i class="fa-solid fa-calendar-days"></i>
                </span>
                <span class="small font-weight-bold text-center"
                  >Movimientos</span
                >
              </button>
            </div>

            <!-- Botón Menú Principal -->
            <div class="col-4 px-1">
              <button
                class="btn btn-light w-100 d-flex flex-column align-items-center py-3"
                id="menuBtn"
              >
                <span class="icon-circle icon-movements mb-2">
                  <i class="fa-solid fa-grip"></i>
                </span>
                <span class="small font-weight-bold text-center">Menú</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Botón Cerrar Sesión -->
      <div class="text-center mt-3 mb-5">
        <button class="btn btn-danger px-5" id="btnCerrarSesion">
          <i class="fa-solid fa-right-from-bracket mr-2"></i>
          <span class="small font-weight-bold">Cerrar Sesión</span>
        </button>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.min.js"></script>
    <script src="sendmoney.js"></script>
  </body>
</html>
