<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=yes"
    />
    <title>Mi Wallet - Enviar Dinero</title>
    <!-- Bootstrap 4.5 CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css"
      integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2"
      crossorigin="anonymous"
    />
    <!-- Font Awesome -->
    <script
      src="https://kit.fontawesome.com/ebe45e2f8b.js"
      crossorigin="anonymous"
    ></script>
    <!-- CSS personalizado -->
    <link rel="stylesheet" href="transaction.css" />
  </head>

  <body class="bg-light">
    <!-- Header -->
    <div class="bg-primary text-white pt-4 pb-3">
      <div class="container">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <h1 class="h3 mb-2">Mi Wallet</h1>
            <p class="small text-white-50 mb-0">Bienvenido, Usuario</p>
          </div>
          <div>
            <i class="fas fa-user-circle fa-2x text-white-50"></i>
          </div>
        </div>
      </div>
    </div>

    <!-- Contenido principal -->
    <div class="container mt-4">
      <!-- Tarjeta de saldo -->
      <div class="card border-0 shadow-sm mb-4">
        <div class="card-body text-center py-4">
          <h5 class="card-title text-muted font-weight-normal">
            Saldo Disponible
          </h5>
          <h1 class="display-4 font-weight-bold" id="balance">$0</h1>
          <small class="text-muted">Actualizado en tiempo real</small>
        </div>
      </div>

      <!-- Alertas dinámicas -->
      <div id="alertContainer"></div>

      <!-- Botón Toggle Últimos Movimientos -->
      <button
        class="btn btn-primary btn-block btn-toggle-movimientos position-relative"
        id="btnToggleMovimientos"
        type="button"
        data-toggle="collapse"
        data-target="#transactionListCollapse"
        aria-expanded="false"
        aria-controls="transactionListCollapse"
      >
        <i class="fas fa-exchange-alt mr-2"></i>Últimos Movimientos
        <i class="fas fa-chevron-down collapse-icon-mov"></i>
      </button>

      <!-- Contenedor colapsable de transacciones -->
      <div class="collapse" id="transactionListCollapse">
        <!-- Filtro por tipo de movimiento (1/3 del ancho, alineado a la derecha) -->
        <div class="d-flex justify-content-end mt-3">
          <div class="filter-select-wrapper">
            <select class="custom-select custom-select-sm" id="filtroTipo">
              <option value="todos" selected>Todos</option>
              <option value="compra">Compra</option>
              <option value="deposito">Depósito</option>
              <option value="transferencia_recibida">
                Transferencia recibida
              </option>
              <option value="transferencia_enviada">
                Transferencia enviada
              </option>
              <option value="pago_servicios">Pago de servicios</option>
              <option value="suscripcion">Suscripción</option>
            </select>
          </div>
        </div>

        <div id="transactionList" class="mt-3"></div>
      </div>

      <!-- Tarjeta con botones de navegación -->
      <div class="card border-0 shadow-sm mb-3 mt-4">
        <div class="card-body p-2">
          <div class="row no-gutters">
            <!-- Botón Depositar -->
            <div class="col-4 pr-1">
              <button
                class="btn btn-light w-100 d-flex flex-column align-items-center py-3"
                id="depositBtn"
              >
                <span class="icon-circle icon-deposit mb-2">
                  <i class="fa-solid fa-money-bill-1-wave"></i>
                </span>
                <span class="small font-weight-bold text-center"
                  >Depositar</span
                >
              </button>
            </div>

            <!-- Botón Enviar Dinero -->
            <div class="col-4 px-1">
              <button
                class="btn btn-light w-100 d-flex flex-column align-items-center py-3"
                id="sendMoneyBtn"
              >
                <span class="icon-circle icon-send mb-2">
                  <i class="fa-solid fa-money-bill-transfer"></i>
                </span>
                <span class="small font-weight-bold text-center"
                  >Enviar Dinero</span
                >
              </button>
            </div>

            <!-- Botón Menú Principal -->
            <div class="col-4 pl-1">
              <button
                class="btn btn-light w-100 d-flex flex-column align-items-center py-3"
                id="menuBtn"
              >
                <span class="icon-circle icon-movements mb-2">
                  <i class="fa-solid fa-grip"></i>
                </span>
                <span class="small font-weight-bold text-center">Menú</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Botón Cerrar Sesión -->
      <div class="text-center mt-3 mb-5">
        <button class="btn btn-danger px-5" id="btnCerrarSesion">
          <i class="fa-solid fa-right-from-bracket mr-2"></i>
          <span class="small font-weight-bold text-center">Cerrar Sesión</span>
        </button>
      </div>
    </div>
    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.min.js"></script>
    <script src="transaction.js"></script>
  </body>
</html>
