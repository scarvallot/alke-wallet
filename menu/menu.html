<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=yes"
    />
    <title>Mi Wallet - Menú</title>
    <!-- Bootstrap 4.5 CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css"
      integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2"
      crossorigin="anonymous"
    />
    <!-- Font Awesome -->
    <script
      src="https://kit.fontawesome.com/ebe45e2f8b.js"
      crossorigin="anonymous"
    ></script>
    <!-- CSS personalizado -->
    <link rel="stylesheet" href="menu.css" />
  </head>
  <body class="bg-light">
    <!-- Header -->
    <div class="bg-primary text-white pt-4 pb-3">
      <div class="container">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <h1 class="h3 mb-2">Mi Wallet</h1>
            <p class="small text-white-50 mb-0">Bienvenido, Usuario</p>
          </div>
          <div>
            <i class="fas fa-user-circle fa-2x text-white-50"></i>
          </div>
        </div>
      </div>
    </div>

    <!-- Contenido principal -->
    <div class="container mt-4">
      <!-- Alertas dinámicas -->
      <div id="alertContainer"></div>

      <!-- Tarjeta de saldo -->
      <div class="card border-0 shadow-sm mb-4">
        <div class="card-body text-center py-4">
          <h5 class="card-title text-muted font-weight-normal">
            Saldo Disponible
          </h5>
          <h1 class="display-4 font-weight-bold" id="balance">$0</h1>
          <small class="text-muted">Actualizado en tiempo real</small>
        </div>
      </div>

      <!-- Tarjeta con botones: Depositar | Enviar Dinero | Últimos Movimientos -->
      <div class="card border-0 shadow-sm mb-3">
        <div class="card-body p-2">
          <div class="row no-gutters">
            <!-- Botón Depositar -->
            <div class="col-4 pr-1">
              <button
                class="btn btn-light w-100 d-flex flex-column align-items-center py-3"
                id="depositBtn"
              >
                <span class="icon-circle icon-deposit mb-2">
                  <i class="fa-solid fa-money-bill-1-wave"></i>
                </span>
                <span class="small font-weight-bold text-center"
                  >Depositar</span
                >
              </button>
            </div>

            <!-- Botón Enviar Dinero -->
            <div class="col-4 px-1">
              <button
                class="btn btn-light w-100 d-flex flex-column align-items-center py-3"
                id="sendMoneyBtn"
              >
                <span class="icon-circle icon-send mb-2">
                  <i class="fa-solid fa-money-bill-transfer"></i>
                </span>
                <span class="small font-weight-bold text-center"
                  >Enviar Dinero</span
                >
              </button>
            </div>

            <!-- Botón Últimos Movimientos -->
            <div class="col-4 pl-1">
              <button
                class="btn btn-light w-100 d-flex flex-column align-items-center py-3"
                id="transactionBtn"
              >
                <span class="icon-circle icon-movements mb-2">
                  <i class="fa-solid fa-calendar-days"></i>
                </span>
                <span class="small font-weight-bold text-center"
                  >Movimientos</span
                >
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Botón Cerrar Sesión -->
      <div class="text-center mt-5">
        <button class="btn btn-danger px-5" id="btnCerrarSesion">
          <i class="fa-solid fa-right-from-bracket mr-2"></i>
          <span class="small font-weight-bold text-center">Cerrar</span>
        </button>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"
      integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.min.js"
      integrity="sha384-w1Q4orYjBQndcko6MimVbzY0tgp4pWB4lZ7lr30WKz0vr/aWKhXdBNmNb5D92v7s"
      crossorigin="anonymous"
    ></script>
    <script src="menu.js"></script>
  </body>
</html>
