<div class="transaction-container">
  <!-- Encabezado de la página -->
  <div class="row mb-4">
    <div class="col-12">
      <h1 class="mb-0">Movimientos</h1>
      <p class="text-muted mt-2">
        Revisa el historial y filtra tus transacciones.
      </p>
    </div>
  </div>

  <!-- Tarjeta de saldo -->
  <div class="card border-0 shadow-sm mb-4">
    <div class="card-body text-center py-4">
      <h5 class="card-title text-muted font-weight-normal">
        Saldo Disponible
      </h5>
      <!-- El ID se mantiene para que transaction.js inyecte el valor -->
      <h1 class="display-4 font-weight-bold text-dark" id="balance">$0</h1>
      <small class="text-muted">Actualizado en tiempo real</small>
    </div>
  </div>

  <!-- Botón Toggle Últimos Movimientos -->
  <button class="btn btn-primary btn-block btn-toggle-movimientos position-relative shadow-sm" id="btnToggleMovimientos" type="button" data-toggle="collapse" data-target="#transactionListCollapse" aria-expanded="false" aria-controls="transactionListCollapse">
    <i class="fas fa-exchange-alt mr-2"></i>Últimos Movimientos
    <i class="fas fa-chevron-down collapse-icon-mov"></i>
  </button>

  <!-- Contenedor colapsable de transacciones -->
  <div class="collapse" id="transactionListCollapse">
    <!-- Filtro por tipo de movimiento -->
    <div class="d-flex justify-content-end mt-3">
      <div class="filter-select-wrapper">
        <select class="custom-select custom-select-sm shadow-sm" id="filtroTipo">
          <option value="todos" selected>Todos</option>
          <option value="compra">Compra</option>
          <option value="deposito">Depósito</option>
          <option value="transferencia_recibida">Transferencia recibida</option>
          <option value="transferencia_enviada">Transferencia enviada</option>
          <option value="pago_servicios">Pago de servicios</option>
          <option value="suscripcion">Suscripción</option>
        </select>
      </div>
    </div>

    <!-- Contenedor donde transaction.js renderizará la lista -->
    <div id="transactionList" class="mt-3"></div>
  </div>

  <!-- Navegación inferior / Acciones rápidas (Usando <a> para enrutamiento Express) -->
  <div class="card border-0 shadow-sm mb-3 mt-5">
    <div class="card-body p-2">
      <div class="row no-gutters text-center">

        <!-- Botón Depositar -->
        <div class="col-4 pr-1">
          <a href="/deposit" class="btn btn-light w-100 d-flex flex-column align-items-center py-3 text-decoration-none">
            <span class="icon-circle icon-deposit mb-2">
              <i class="fa-solid fa-money-bill-1-wave text-success"></i>
            </span>
            <span class="small font-weight-bold text-dark">Depositar</span>
          </a>
        </div>

        <!-- Botón Enviar Dinero -->
        <div class="col-4 px-1">
          <a href="/sendmoney" class="btn btn-light w-100 d-flex flex-column align-items-center py-3 text-decoration-none">
            <span class="icon-circle icon-send mb-2">
              <i class="fa-solid fa-money-bill-transfer text-primary"></i>
            </span>
            <span class="small font-weight-bold text-dark">Enviar</span>
          </a>
        </div>

        <!-- Botón Menú Principal -->
        <div class="col-4 pl-1">
          <a href="/menu" class="btn btn-light w-100 d-flex flex-column align-items-center py-3 text-decoration-none">
            <span class="icon-circle icon-movements mb-2">
              <i class="fa-solid fa-grip text-secondary"></i>
            </span>
            <span class="small font-weight-bold text-dark">Menú</span>
          </a>
        </div>

      </div>
    </div>
  </div>
</div>
